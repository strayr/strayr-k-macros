[menu __main __setup __calib]
type: list
name: Calibration


# remove delta
[menu __main __setup __calib __delta_calib_auto]
type: command
enable: false
name: Delta cal. auto
gcode:
    G28
    DELTA_CALIBRATE

[menu __main __setup __calib __delta_calib_man]
type: list
enable: false
name: Delta cal. man

[menu __main __setup __calib __bedprobe]
type: command
enable: false
#enable: {not printer.idle_timeout.state == "Printing"}
name: Bed probe
gcode: PROBE


# remove delta END

[menu __main __setup __calib __probe]
type: list
name: Set Z Offset

[menu __main __setup __calib __probe __beginzpc]
type: command
enable: true 
name: Calibrate Z-Probe
gcode:
        PROBE_CALIBRATE
        
[menu __main __setup __calib __probe __beginzesc]
type: command
enable: true 
name: Calibrate Endstop
gcode:
        _SOUND_YES
        Z_ENDSTOP_CALIBRATE


[menu __main __setup __calib __probe __accept]
type: command
name: Accept
gcode:
        ACCEPT
        # WE REALLY WANT TO PUT THE TOOLHEAD SOMEWHEWRE SAFE BEFORE SAVE_CONFIG
        PARK

[menu __main __setup __calib __probe __abort]
type: command
name: Abort
gcode:
        ABORT
        PARK
#action: back

[menu __main __setup __calib __probe __accuracy]
type: command
name: Test accuracy
gcode:
    G28
    PROBE_ACCURACY

[menu __main __setup __calib __save_config]
type: command
name: Save config
gcode:
        SAVE_CONFIG


[menu __main __setup __calib __home_all_axes]
type: command
name: Home XYZ
gcode:
        G28


